# User-approved September 19 unattended local project execution.
approval_policy = "never"
sandbox_mode = "danger-full-access"

# Reporter Growth v2 — project-scoped Codex subagent routing.
# Intentionally does NOT set the coordinator model; select gpt-6-astra / xhigh in the new task.
# All child roles remain on Standard/default processing. Never use Fast, Priority, or Ultrafast.
service_tier = "default"

[agents]
enabled = true
max_concurrent_threads_per_session = 1
default_subagent_model = "gpt-6-astra"
default_subagent_reasoning_effort = "high"

[agents.experience]
description = "P4 Experience Lead: shared design system, shell, Overview/Funnel proof, shared-component changes, and workspace fidelity review."
config_file = "./agents/experience.toml"

[agents.experience_reporters]
description = "P4 Reporters presentation specialist after visual proof; uses the frozen shared system and owns only the Reporters feature presentation."
config_file = "./agents/experience_reporters.toml"

[agents.experience_team]
description = "P4 Team presentation specialist after visual proof; uses the frozen shared system and owns only the Team feature presentation."
config_file = "./agents/experience_team.toml"

[agents.experience_programs]
description = "P4 Programs presentation specialist after visual proof; uses the frozen shared system and owns only the Programs feature presentation."
config_file = "./agents/experience_programs.toml"

[agents.data]
description = "P4 serial data-preparation lane: preserve the completed 50-person sample; bounded linked-work histories, validation, repository, and reset."
config_file = "./agents/data.toml"

[agents.capacity]
description = "P4 on-demand capacity logic support only after an explicit contract-change request; no presentation ownership."
config_file = "./agents/capacity.toml"

[agents.recruiting]

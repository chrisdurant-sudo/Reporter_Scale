# Reporter Growth v2 — project-scoped Codex subagent routing.
# Intentionally does NOT set the coordinator model; choose the coordinator interactively.
# All child roles remain on Standard/default processing. Never use Fast, Priority, or Ultrafast.
service_tier = "default"

[agents]
enabled = true
max_concurrent_threads_per_session = 1
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

[agents.experience]
description = "P4 single presentation owner: shared shell, all five workspace presentation surfaces, charts, grids, interaction state, and responsive behavior."
config_file = "./agents/experience.toml"

[agents.data]
description = "P4 serial data-preparation lane: balanced 50-person synthetic expansion, complete histories, validation, repository, and reset."
config_file = "./agents/data.toml"

[agents.capacity]
description = "P4 on-demand capacity logic support only after an explicit contract-change request; no presentation ownership."
config_file = "./agents/capacity.toml"

[agents.recruiting]
description = "P4 on-demand recruiting logic support only after an explicit contract-change request; no presentation ownership."
config_file = "./agents/recruiting.toml"

[agents.network]
description = "P4 on-demand network logic support only after an explicit contract-change request; no presentation ownership."
config_file = "./agents/network.toml"

[agents.team]
description = "P4 on-demand team logic support only after an explicit contract-change request; no presentation ownership."
config_file = "./agents/team.toml"

[agents.programs]
description = "P4 on-demand programs logic support only after an explicit contract-change request; no presentation ownership."
config_file = "./agents/programs.toml"

[agents.quality]
description = "P4 independent Quality after integration: locked-reference comparison, cross-workspace acceptance, and browser tests only; no production repairs."
config_file = "./agents/quality.toml"

[agents.reviewer]
description = "Read-only P4 final reviewer for the exact Quality-passed commit and locked visual/data contracts."
config_file = "./agents/reviewer.toml"

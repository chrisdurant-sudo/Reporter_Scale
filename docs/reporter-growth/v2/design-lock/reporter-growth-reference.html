  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    #reporter-growth-tab-canvas .rg-loop-button strong {

      font-size: 13px;
      font-weight: 500;

    #reporter-growth-tab-canvas .rg-main { padding: 18px; }

        return funnelRows.filter(row =&gt; (state.selectedMarket === &quot;ALL&quot; || row.market === state.selectedMarket) &amp;&amp; state.funnelStatuses.includes(row.status));
      }

      function renderFunnelControls() {
        const marketRows = funnelRows.filter(row =&gt; state.selectedMarket === &quot;ALL&quot; || row.market === state.selectedMarket);
        return `&lt;div class=&quot;rg-table-controls&quot; aria-label=&quot;Funnel filters&quot;&gt;
          &lt;div class=&quot;rg-status-filters&quot; aria-label=&quot;Filter by status&quot;&gt;
            ${funnelStages.map(status =&gt; `&lt;button class=&quot;rg-status-button&quot; type=&quot;button&quot; data-funnel-status-filter=&quot;${status}&quot; aria-pressed=&quot;${state.funnelStatuses.includes(status)}&quot;&gt;${status} ${marketRows.filter(row =&gt; row.status === status).length}&lt;/button&gt;`).join(&quot;&quot;)}
          &lt;/div&gt;
          &lt;input class=&quot;rg-control-input&quot; type=&quot;search&quot; data-table-search aria-label=&quot;Find candidate&quot; placeholder=&quot;Find candidate…&quot;&gt;
          &lt;select class=&quot;rg-control-select&quot; data-table-filter aria-label=&quot;Waiting on&quot;&gt;&lt;option&gt;All waiting on&lt;/option&gt;&lt;option&gt;Candidate&lt;/option&gt;&lt;option&gt;Recruiting&lt;/option&gt;&lt;option&gt;Market team&lt;/option&gt;&lt;option&gt;Training&lt;/option&gt;&lt;/select&gt;
          &lt;select class=&quot;rg-control-select&quot; data-table-filter aria-label=&quot;Sort&quot;&gt;&lt;option&gt;Needs attention&lt;/option&gt;&lt;option&gt;Longest waiting&lt;/option&gt;&lt;option&gt;Name&lt;/option&gt;&lt;/select&gt;
        &lt;/div&gt;`;
      }

      function renderFunnelTable() {
        const rows = funnelRowsForView();
        return `&lt;div class=&quot;rg-work-grid rg-full-width&quot;&gt;
          &lt;section class=&quot;rg-panel&quot;&gt;
            &lt;header class=&quot;rg-panel-head&quot;&gt;&lt;h3&gt;Candidates&lt;/h3&gt;&lt;span&gt;${rows.length} shown&lt;/span&gt;&lt;/header&gt;
            ${renderFunnelControls()}
            &lt;div class=&quot;rg-table-wrap&quot;&gt;
              &lt;table class=&quot;rg-wide-table&quot;&gt;
                &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Candidate&lt;/th&gt;&lt;th&gt;Market&lt;/th&gt;&lt;th&gt;Status&lt;/th&gt;&lt;th&gt;Next step&lt;/th&gt;&lt;th&gt;Waiting on&lt;/th&gt;&lt;th&gt;Total in funnel&lt;/th&gt;&lt;th&gt;Time in status&lt;/th&gt;&lt;th&gt;Notes&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
                &lt;tbody&gt;${rows.map(row =&gt; {
                  const market = row.market in state.slas ? row.market : &quot;DEFAULT&quot;;
                  const overall = state.slas[market].overall;
                  const stage = state.slas[market][row.status];
                  const note = state.notes[row.id] ?? row.note;
                  return `&lt;tr data-record-row&gt;&lt;td&gt;&lt;strong&gt;${row.name}&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;${row.market}&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rg-status&quot;&gt;${row.status}&lt;/span&gt;&lt;/td&gt;&lt;td&gt;${row.next}&lt;/td&gt;&lt;td&gt;${row.waiting}&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rg-sla-pill ${slaClass(row.total, overall)}&quot;&gt;${row.total} / ${overall} days · ${slaWord(row.total, overall)}&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rg-sla-pill ${slaClass(row.inStatus, stage)}&quot;&gt;${row.inStatus} / ${stage} days · ${slaWord(row.inStatus, stage)}&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;input class=&quot;rg-note-input&quot; value=&quot;${escapeHtml(note)}&quot; data-candidate-note=&quot;${row.id}&quot; aria-label=&quot;Note for ${row.name}&quot; placeholder=&quot;Add note&quot;&gt;&lt;/td&gt;&lt;/tr&gt;`;
                }).join(&quot;&quot;)}&lt;/tbody&gt;
              &lt;/table&gt;
            &lt;/div&gt;
          &lt;/section&gt;
        &lt;/div&gt;`;
      }

      function renderReporterTable() {
        const rows = reporterRows.filter(row =&gt; state.selectedMarket === &quot;ALL&quot; || row.market === state.selectedMarket);
        return `&lt;div class=&quot;rg-work-grid rg-full-width&quot;&gt;
          &lt;section class=&quot;rg-panel&quot;&gt;
            &lt;header class=&quot;rg-panel-head&quot;&gt;&lt;h3&gt;Reporters&lt;/h3&gt;&lt;span&gt;${rows.length} shown&lt;/span&gt;&lt;/header&gt;
            ${renderTableControls(data.reporters)}
            &lt;div class=&quot;rg-table-wrap&quot;&gt;
              &lt;table class=&quot;rg-reporter-table&quot;&gt;
                &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Reporter&lt;/th&gt;&lt;th&gt;Market&lt;/th&gt;&lt;th&gt;Skills&lt;/th&gt;&lt;th&gt;Certifications&lt;/th&gt;&lt;th&gt;Preferences&lt;/th&gt;&lt;th&gt;Last active&lt;/th&gt;&lt;th&gt;Compliance&lt;/th&gt;&lt;th&gt;Follow-up&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
                &lt;tbody&gt;${rows.map(row =&gt; {
                  const activityClass = row.lastActive &lt; 28 ? &quot;rg-sla-under&quot; : row.lastActive === 28 ? &quot;rg-sla-at&quot; : &quot;rg-sla-over&quot;;
                  const complianceClass = row.compliance === &quot;Clear&quot; ? &quot;rg-sla-under&quot; : row.compliance.includes(&quot;expires&quot;) ? &quot;rg-sla-at&quot; : &quot;rg-sla-over&quot;;
                  return `&lt;tr data-record-row&gt;&lt;td&gt;&lt;strong&gt;${row.name}&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;${row.market}&lt;/td&gt;&lt;td&gt;${row.skills}&lt;/td&gt;&lt;td&gt;${row.certs}&lt;/td&gt;&lt;td&gt;${row.preferences}&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rg-sla-pill ${activityClass}&quot;&gt;${row.lastActive} days ago&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rg-sla-pill ${complianceClass}&quot;&gt;${row.compliance}&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;rg-follow-actions&quot;&gt;&lt;button type=&quot;button&quot; data-follow-up=&quot;availability&quot; data-reporter=&quot;${escapeHtml(row.name)}&quot;&gt;Confirm availability&lt;/button&gt;&lt;button type=&quot;button&quot; data-follow-up=&quot;reconnect&quot; data-reporter=&quot;${escapeHtml(row.name)}&quot;&gt;Create re-engagement task&lt;/button&gt;&lt;button type=&quot;button&quot; data-follow-up=&quot;checklist&quot; data-reporter=&quot;${escapeHtml(row.name)}&quot;&gt;Inspect checklist&lt;/button&gt;&lt;/div&gt;&lt;/td&gt;&lt;/tr&gt;`;
                }).join(&quot;&quot;)}&lt;/tbody&gt;
              &lt;/table&gt;
            &lt;/div&gt;
          &lt;/section&gt;
        &lt;/div&gt;`;
      }

      function programsForView() {
        return programRows.filter(row =&gt; (state.selectedMarket === &quot;ALL&quot; || row.markets.includes(state.selectedMarket)) &amp;&amp; (state.programType === &quot;All&quot; || row.type === state.programType) &amp;&amp; (state.programStatus === &quot;All&quot; || row.status === state.programStatus));
      }

      function renderProgramTable() {
        const rows = programsForView();
        return `&lt;div class=&quot;rg-work-grid rg-full-width&quot;&gt;
          &lt;section class=&quot;rg-panel&quot;&gt;
            &lt;header class=&quot;rg-panel-head&quot;&gt;&lt;h3&gt;Programs&lt;/h3&gt;&lt;span&gt;${rows.length} shown&lt;/span&gt;&lt;/header&gt;
            &lt;div class=&quot;rg-table-controls&quot; aria-label=&quot;Program filters&quot;&gt;
              &lt;input class=&quot;rg-control-input&quot; type=&quot;search&quot; data-table-search aria-label=&quot;Find program&quot; placeholder=&quot;Find program…&quot;&gt;
              &lt;select class=&quot;rg-control-select&quot; data-program-type aria-label=&quot;Type&quot;&gt;&lt;option${state.programType === &quot;All&quot; ? &quot; selected&quot; : &quot;&quot;}&gt;All&lt;/option&gt;${[&quot;Experiment&quot;, &quot;Campaign&quot;, &quot;Sourcing&quot;, &quot;Process&quot;].map(type =&gt; `&lt;option${state.programType === type ? &quot; selected&quot; : &quot;&quot;}&gt;${type}&lt;/option&gt;`).join(&quot;&quot;)}&lt;/select&gt;
              &lt;select class=&quot;rg-control-select&quot; data-program-status aria-label=&quot;Status&quot;&gt;&lt;option${state.programStatus === &quot;All&quot; ? &quot; selected&quot; : &quot;&quot;}&gt;All&lt;/option&gt;${[&quot;Running&quot;, &quot;Review now&quot;, &quot;Stopped&quot;].map(status =&gt; `&lt;option${state.programStatus === status ? &quot; selected&quot; : &quot;&quot;}&gt;${status}&lt;/option&gt;`).join(&quot;&quot;)}&lt;/select&gt;
            &lt;/div&gt;
            &lt;div class=&quot;rg-table-wrap&quot;&gt;
              &lt;table class=&quot;rg-program-table&quot;&gt;
                &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Type&lt;/th&gt;&lt;th&gt;Program&lt;/th&gt;&lt;th&gt;Market&lt;/th&gt;&lt;th&gt;Brief&lt;/th&gt;&lt;th&gt;Start&lt;/th&gt;&lt;th&gt;Review&lt;/th&gt;&lt;th&gt;Goal&lt;/th&gt;&lt;th&gt;Results so far&lt;/th&gt;&lt;th&gt;Notes&lt;/th&gt;&lt;th&gt;Next step&lt;/th&gt;&lt;th&gt;Source&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
                &lt;tbody&gt;${rows.map(row =&gt; `&lt;tr data-record-row&gt;&lt;td&gt;&lt;span class=&quot;rg-status&quot;&gt;${row.type}&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;${row.name}&lt;/strong&gt;&lt;br&gt;${row.status}&lt;/td&gt;&lt;td&gt;${row.markets.join(&quot;, &quot;)}&lt;/td&gt;&lt;td&gt;${row.brief}&lt;/td&gt;&lt;td&gt;${row.start}&lt;/td&gt;&lt;td&gt;${row.review}&lt;/td&gt;&lt;td&gt;${row.goal}&lt;/td&gt;&lt;td&gt;${row.result}&lt;/td&gt;&lt;td&gt;&lt;input class=&quot;rg-inline-input&quot; value=&quot;${escapeHtml(state.programNotes[row.id] ?? row.note)}&quot; data-program-note=&quot;${row.id}&quot; aria-label=&quot;Notes for ${row.name}&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input class=&quot;rg-inline-input&quot; value=&quot;${escapeHtml(state.programNext[row.id] ?? row.next)}&quot; data-program-next=&quot;${row.id}&quot; aria-label=&quot;Next step for ${row.name}&quot;&gt;&lt;/td&gt;&lt;td&gt;${row.source}&lt;/td&gt;&lt;/tr&gt;`).join(&quot;&quot;)}&lt;/tbody&gt;
              &lt;/table&gt;
            &lt;/div&gt;
          &lt;/section&gt;
        &lt;/div&gt;`;
      }

      function renderTeamBoard() {
        const columns = [&quot;To do&quot;, &quot;In progress&quot;, &quot;Done&quot;];
        return `&lt;section class=&quot;rg-panel rg-kanban-panel&quot; aria-label=&quot;Team work board&quot;&gt;
          &lt;header class=&quot;rg-panel-head&quot;&gt;&lt;h3&gt;Work board&lt;/h3&gt;&lt;div class=&quot;rg-kanban-actions&quot;&gt;&lt;span&gt;${state.teamWork.length} items&lt;/span&gt;&lt;button class=&quot;rg-control-button&quot; type=&quot;button&quot; data-toggle-add-work aria-pressed=&quot;${state.showAddWork}&quot;&gt;${state.showAddWork ? &quot;Close&quot; : &quot;Add work&quot;}&lt;/button&gt;&lt;/div&gt;&lt;/header&gt;
          &lt;div class=&quot;rg-kanban&quot;&gt;
            ${columns.map(column =&gt; `&lt;div class=&quot;rg-kanban-column&quot;&gt;&lt;div class=&quot;rg-kanban-column-head&quot;&gt;&lt;span&gt;${column}&lt;/span&gt;&lt;span&gt;${state.teamWork.filter(item =&gt; item.status === column).length}&lt;/span&gt;&lt;/div&gt;${state.teamWork.filter(item =&gt; item.status === column).map(item =&gt; `&lt;article class=&quot;rg-work-card&quot;&gt;&lt;strong&gt;${escapeHtml(item.title)}&lt;/strong&gt;&lt;p&gt;${escapeHtml(item.owner)} · ${escapeHtml(item.domain)}&lt;/p&gt;${item.link ? `&lt;p&gt;Linked: ${escapeHtml(item.link)}&lt;/p&gt;` : &quot;&quot;}&lt;/article&gt;`).join(&quot;&quot;) || `&lt;p class=&quot;rg-label&quot;&gt;No work&lt;/p&gt;`}&lt;/div&gt;`).join(&quot;&quot;)}
          &lt;/div&gt;
          ${state.showAddWork ? `&lt;div class=&quot;rg-add-work-form&quot;&gt;&lt;input class=&quot;rg-inline-input&quot; data-new-work-title aria-label=&quot;Work title&quot; placeholder=&quot;Work item&quot;&gt;&lt;select class=&quot;rg-control-select&quot; data-new-work-owner aria-label=&quot;Owner&quot;&gt;&lt;option&gt;Unassigned&lt;/option&gt;&lt;option&gt;Maya&lt;/option&gt;&lt;option&gt;Noah&lt;/option&gt;&lt;option&gt;Sam&lt;/option&gt;&lt;/select&gt;&lt;select class=&quot;rg-control-select&quot; data-new-work-status aria-label=&quot;Status&quot;&gt;&lt;option&gt;To do&lt;/option&gt;&lt;option&gt;In progress&lt;/option&gt;&lt;option&gt;Done&lt;/option&gt;&lt;/select&gt;&lt;select class=&quot;rg-control-select&quot; data-new-work-domain aria-label=&quot;Domain&quot;&gt;&lt;option&gt;Sourcing&lt;/option&gt;&lt;option&gt;Screening&lt;/option&gt;&lt;option&gt;Onboarding&lt;/option&gt;&lt;option&gt;Market&lt;/option&gt;&lt;option&gt;Program&lt;/option&gt;&lt;/select&gt;&lt;input class=&quot;rg-inline-input&quot; data-new-work-link aria-label=&quot;Linked program or campaign&quot; placeholder=&quot;Linked program or campaign&quot;&gt;&lt;button class=&quot;rg-primary-button&quot; type=&quot;button&quot; data-add-work&gt;Add&lt;/button&gt;&lt;/div&gt;` : &quot;&quot;}
        &lt;/section&gt;`;
      }

      function renderOverview(item) {
        if (!item.overviews) return &quot;&quot;;
        return `&lt;section class=&quot;rg-overview-grid&quot; aria-label=&quot;Cross-workspace overview&quot;&gt;
          ${item.overviews.map(overview =&gt; `&lt;article class=&quot;rg-overview-item&quot;&gt;&lt;p class=&quot;rg-label&quot;&gt;${overview[0]}&lt;/p&gt;&lt;h3&gt;${overview[1]}&lt;/h3&gt;&lt;p&gt;${overview[2]}&lt;/p&gt;&lt;strong&gt;View →&lt;/strong&gt;&lt;/article&gt;`).join(&quot;&quot;)}
        &lt;/section&gt;`;
      }

      function renderPrimaryVisual(item) {
        if (item.chartKind === &quot;trend&quot;) {
          return `&lt;div class=&quot;rg-chart&quot;&gt;
            &lt;p class=&quot;rg-chart-summary&quot;&gt;${item.chartSummary}&lt;/p&gt;
            &lt;div class=&quot;rg-trend-chart&quot; data-trend-chart role=&quot;img&quot; aria-label=&quot;Verified usable supply, demand, and recommended supply from December through March. Forecast values begin after February 16.&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;rg-legend&quot;&gt;${item.legend.map(entry =&gt; `&lt;span style=&quot;--legend-color:var(--rg-${entry[1] === &quot;a&quot; ? &quot;accent&quot; : entry[1] === &quot;b&quot; ? &quot;primary&quot; : &quot;warning&quot;})&quot;&gt;${entry[0]}&lt;/span&gt;`).join(&quot;&quot;)}&lt;/div&gt;
          &lt;/div&gt;`;
        }
        if (item.chartKind === &quot;funnel-trend&quot;) {
          return `&lt;div class=&quot;rg-chart&quot;&gt;
            &lt;p class=&quot;rg-chart-summary&quot;&gt;${item.chartSummary}&lt;/p&gt;
            &lt;div class=&quot;rg-local-controls rg-chart-controls&quot; aria-label=&quot;Funnel trend controls&quot;&gt;
              ${[&quot;R7&quot;, &quot;R28&quot;].map(range =&gt; `&lt;button class=&quot;rg-control-button&quot; type=&quot;button&quot; data-funnel-range=&quot;${range}&quot; aria-pressed=&quot;${state.funnelRange === range}&quot;&gt;${range}&lt;/button&gt;`).join(&quot;&quot;)}
              ${funnelStages.map(status =&gt; `&lt;button class=&quot;rg-control-button&quot; type=&quot;button&quot; data-funnel-chart-status=&quot;${status}&quot; aria-pressed=&quot;${state.funnelChartStatus === status}&quot;&gt;${status}&lt;/button&gt;`).join(&quot;&quot;)}
            &lt;/div&gt;
            &lt;div class=&quot;rg-trend-chart&quot; data-funnel-chart role=&quot;img&quot; aria-label=&quot;Wait time trend for ${state.funnelChartStatus} compared with its SLA.&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;rg-legend&quot;&gt;&lt;span style=&quot;--legend-color:var(--rg-primary)&quot;&gt;Wait time&lt;/span&gt;&lt;span style=&quot;--legend-color:var(--rg-warning)&quot;&gt;SLA&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;`;
        }
        if (item.chartKind === &quot;bottleneck&quot;) {
          return `&lt;div class=&quot;rg-chart&quot; role=&quot;img&quot; aria-label=&quot;Funnel conversion and waiting time by stage&quot;&gt;
            &lt;p class=&quot;rg-chart-summary&quot;&gt;${item.chartSummary}&lt;/p&gt;
            &lt;div class=&quot;rg-bottleneck-chart&quot;&gt;
              ${item.chartRows.map(row =&gt; `&lt;div class=&quot;rg-bottleneck-row&quot;&gt;&lt;strong&gt;${row[0]}&lt;/strong&gt;&lt;div class=&quot;rg-bottleneck-measure&quot;&gt;&lt;span&gt;${row[1]}% still moving&lt;/span&gt;&lt;div class=&quot;rg-mini-track&quot;&gt;&lt;i style=&quot;width:${row[1]}%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;rg-bottleneck-measure is-wait&quot;&gt;&lt;span&gt;${row[2]} days waiting&lt;/span&gt;&lt;div class=&quot;rg-mini-track&quot;&gt;&lt;i style=&quot;width:${Math.min(100, row[2] / 12 * 100)}%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;rg-bottleneck-flag&quot;&gt;${row[3]}&lt;/span&gt;&lt;/div&gt;`).join(&quot;&quot;)}
            &lt;/div&gt;
            &lt;div class=&quot;rg-legend&quot;&gt;&lt;span style=&quot;--legend-color:var(--rg-accent)&quot;&gt;Still moving&lt;/span&gt;&lt;span style=&quot;--legend-color:var(--rg-warning)&quot;&gt;Wait time&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;`;
        }
        if (item.chartKind === &quot;pilot-trend&quot;) {
          return `&lt;div class=&quot;rg-chart&quot;&gt;
            &lt;p class=&quot;rg-chart-summary&quot;&gt;${item.chartSummary}&lt;/p&gt;
            &lt;div class=&quot;rg-trend-chart&quot; data-program-chart role=&quot;img&quot; aria-label=&quot;Checklist pilot result rises above its 50 percent target in week four.&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;rg-legend&quot;&gt;&lt;span style=&quot;--legend-color:var(--rg-accent)&quot;&gt;Pilot result&lt;/span&gt;&lt;span style=&quot;--legend-color:var(--rg-warning)&quot;&gt;Target&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;`;
        }
        return `&lt;div class=&quot;rg-chart&quot; role=&quot;img&quot; aria-label=&quot;${item.chartTitle}. ${item.chartSummary}&quot;&gt;
          &lt;p class=&quot;rg-chart-summary&quot;&gt;${item.chartSummary}&lt;/p&gt;
          &lt;div class=&quot;rg-chart-rows&quot;&gt;
            ${item.chartRows.map(row =&gt; `&lt;div class=&quot;rg-chart-row&quot;&gt;&lt;span&gt;${row[0]}&lt;/span&gt;&lt;div class=&quot;rg-bar-track&quot;&gt;${segments(row[1])}&lt;/div&gt;&lt;strong&gt;${row[2]}&lt;/strong&gt;&lt;/div&gt;`).join(&quot;&quot;)}
          &lt;/div&gt;
          &lt;div class=&quot;rg-legend&quot;&gt;${item.legend.map(entry =&gt; `&lt;span style=&quot;--legend-color:var(--rg-${entry[1] === &quot;a&quot; ? &quot;accent&quot; : entry[1] === &quot;b&quot; ? &quot;primary&quot; : entry[1] === &quot;c&quot; ? &quot;warning&quot; : &quot;danger&quot;})&quot;&gt;${entry[0]}&lt;/span&gt;`).join(&quot;&quot;)}&lt;/div&gt;
        &lt;/div&gt;`;
      }

      function renderFocusArea(item) {
        if (state.activeTab === &quot;team&quot;) return renderTeamBoard();
        return `&lt;div class=&quot;rg-focus-grid&quot;&gt;
          &lt;section class=&quot;rg-panel&quot;&gt;
            &lt;header class=&quot;rg-panel-head&quot;&gt;&lt;h3&gt;What needs attention&lt;/h3&gt;&lt;span&gt;3 items&lt;/span&gt;&lt;/header&gt;
            &lt;div class=&quot;rg-priority-list&quot;&gt;
              ${item.priorities.map((priority, index) =&gt; `&lt;button class=&quot;rg-priority-button&quot; type=&quot;button&quot; data-priority=&quot;${index}&quot; aria-pressed=&quot;${index === state.selectedPriority}&quot;&gt;&lt;span class=&quot;rg-priority-number&quot;&gt;${index + 1}&lt;/span&gt;&lt;span&gt;&lt;span class=&quot;rg-priority-meta&quot;&gt;${priority[0]}&lt;/span&gt;&lt;span class=&quot;rg-priority-title&quot;&gt;${priority[1]}&lt;/span&gt;&lt;span class=&quot;rg-priority-action&quot;&gt;${priority[2]}&lt;/span&gt;&lt;/span&gt;&lt;/button&gt;`).join(&quot;&quot;)}
            &lt;/div&gt;
          &lt;/section&gt;
          &lt;section class=&quot;rg-panel&quot;&gt;
            &lt;header class=&quot;rg-panel-head&quot;&gt;&lt;h3&gt;${item.chartTitle}&lt;/h3&gt;&lt;/header&gt;
            ${renderPrimaryVisual(item)}
          &lt;/section&gt;
        &lt;/div&gt;`;
      }

      function renderSimpleTable(item, rows, title) {
        return `&lt;div class=&quot;rg-work-grid rg-full-width&quot;&gt;&lt;section class=&quot;rg-panel&quot;&gt;&lt;header class=&quot;rg-panel-head&quot;&gt;&lt;h3&gt;${title}&lt;/h3&gt;&lt;span&gt;${rows.length} shown&lt;/span&gt;&lt;/header&gt;${renderTableControls(item)}&lt;div class=&quot;rg-table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;${item.columns.map(column =&gt; `&lt;th scope=&quot;col&quot;&gt;${column}&lt;/th&gt;`).join(&quot;&quot;)}&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${rows.map(row =&gt; `&lt;tr data-record-row&gt;${row.map(cell =&gt; `&lt;td&gt;${cell}&lt;/td&gt;`).join(&quot;&quot;)}&lt;/tr&gt;`).join(&quot;&quot;)}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;`;
      }

      function renderRecordsArea(item, selected, tableRows) {
        if (state.activeTab === &quot;recruiting&quot;) return renderFunnelTable();
        if (state.activeTab === &quot;reporters&quot;) return renderReporterTable();
        if (state.activeTab === &quot;programs&quot;) return renderProgramTable();
        if (state.activeTab === &quot;team&quot;) return renderSimpleTable(item, item.rows, &quot;Team&quot;);
        return `&lt;div class=&quot;rg-work-grid&quot;&gt;
          &lt;section class=&quot;rg-panel&quot;&gt;

          ${yTicks.map(tick =&gt; `&lt;line class=&quot;rg-grid-line&quot; x1=&quot;${margin.left}&quot; y1=&quot;${y(tick)}&quot; x2=&quot;${width - margin.right}&quot; y2=&quot;${y(tick)}&quot;&gt;&lt;/line&gt;&lt;text x=&quot;${margin.left - 8}&quot; y=&quot;${y(tick) + 4}&quot; text-anchor=&quot;end&quot;&gt;${tick.toFixed(1)}d&lt;/text&gt;`).join(&quot;&quot;)}

      function render() {
        const item = data[state.activeTab];
        const selected = item.priorities[Math.min(state.selectedPriority, item.priorities.length - 1)];
        const tableRows = state.activeTab === &quot;markets&quot; &amp;&amp; state.selectedMarket !== &quot;ALL&quot;
          ? item.rows.filter(row =&gt; row[0] === state.selectedMarket)
          : item.rows;
        app.innerHTML = `
          &lt;section class=&quot;rg-window&quot; data-layout=&quot;${state.layoutMode}&quot; aria-label=&quot;Reporter Growth collaborative redesign canvas&quot;&gt;
            &lt;header class=&quot;rg-topbar&quot;&gt;
              &lt;div&gt;
                &lt;h1&gt;Provider growth command center&lt;/h1&gt;
              &lt;/div&gt;
              &lt;div class=&quot;rg-market-state&quot;&gt;

          requestAnimationFrame(drawMarketTrend);
          const trendHost = root.querySelector(&quot;[data-trend-chart]&quot;);
          if (trendHost &amp;&amp; globalThis.ResizeObserver) {
            trendObserver = new ResizeObserver(drawMarketTrend);
            trendObserver.observe(trendHost);

      root.addEventListener(&quot;click&quot;, async (event) =&gt; {
        const button = event.target.closest(&quot;button&quot;);
        if (!button) return;
        if (button.dataset.market) {
          state.selectedMarket = button.dataset.market;
          render();
          saveState();
          return;
        }
        if (button.dataset.tab) {
          state.activeTab = button.dataset.tab;
          state.selectedPriority = 0;
          render();
          saveState();
          return;
        }
        if (button.dataset.priority !== undefined) {
          state.selectedPriority = Number(button.dataset.priority);
          render();
          saveState();
          return;
        }
        if (button.dataset.localView) {
          state.localView[state.activeTab] = button.dataset.localView;
          render();
          saveState();
          return;
        }
        if (button.hasAttribute(&quot;data-projection&quot;)) {
          state.projection = !state.projection;
          render();
          saveState();
          return;
        }
        if (button.hasAttribute(&quot;data-edit-sla&quot;)) {
          state.editSla = !state.editSla;
          render();
          return;
        }
        if (button.dataset.funnelRange) {
          state.funnelRange = button.dataset.funnelRange;
          render();
          saveState();
          return;
        }
        if (button.dataset.funnelChartStatus) {
          state.funnelChartStatus = button.dataset.funnelChartStatus;
          render();
          saveState();
          return;
        }
        if (button.dataset.funnelStatusFilter) {
          const status = button.dataset.funnelStatusFilter;
          state.funnelStatuses = state.funnelStatuses.includes(status)
            ? state.funnelStatuses.filter(value =&gt; value !== status)

  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)

    target?.nodeType != null &amp;&amp; trigger.contains(target);

      tooltip.id = tooltipId;
